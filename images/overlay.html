<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наложение изображений</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h1 {dino_1.png
            text-align: center;
        }

        .image-container {
            position: relative;
            width: 800px;
            max-width: 90vw;
            margin: 30px auto;
        }

        /* Нижнее изображение */
        .base-image {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Верхнее изображение */
        .overlay-image {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 1;
        }

        .controls {
            width: 800px;
            max-width: 90vw;
            margin: 20px auto;
        }

        #opacity {
            width: 100%;
        }
            
        h1 {
                text-align: center;
        }

    </style>
</head>

<body>

    <h1>Наложение изображений</h1>

    <div class="image-container">

        <img
            src="background_16.png"
            class="base-image"
            alt="Первое изображение"
        >

        <img
            src="dino_1.png"
            class="overlay-image"
            id="overlayImage"
            alt="Второе изображение"
        >

    </div>

</body>
</html>
